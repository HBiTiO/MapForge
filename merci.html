<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci pour votre achat — MapForge</title>
<link rel="icon" type="image/png" href="logo.png?v=3">
<style>
:root{--bg:#08060d;--purple:#8f52d8;--purple2:#67399c;--text:#fff;--muted:#bdb2ca;--border:rgba(220,193,255,.18)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(143,82,216,.22),transparent 42%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.card{width:min(680px,100%);padding:44px 34px;text-align:center;background:linear-gradient(180deg,rgba(24,17,34,.96),rgba(12,9,17,.98));border:1px solid var(--border);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.logo{width:74px;height:74px;object-fit:cover;border-radius:18px;margin-bottom:22px}.check{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:rgba(143,82,216,.18);border:1px solid rgba(220,193,255,.35);font-size:30px}
h1{margin:0 0 12px;font-size:clamp(30px,5vw,44px)}p{margin:0 auto 26px;max-width:520px;color:var(--muted);line-height:1.7}
.download{display:inline-flex;align-items:center;justify-content:center;min-width:260px;padding:15px 24px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;text-decoration:none;font-weight:800;box-shadow:0 12px 30px rgba(103,57,156,.35);transition:.2s ease}.download:hover{transform:translateY(-2px);filter:brightness(1.08)}
.back{display:block;margin-top:18px;color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:#fff}
.note{margin-top:28px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.025);color:#9f94ad;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="logo.png?v=3" alt="MapForge">
<div class="check">✓</div>
<h1>Merci pour votre achat !</h1>
<p>Votre commande RedWood est terminée. Vous pouvez maintenant récupérer le fichier de la map directement ci-dessous.</p>
<a class="download" href="downloads/RedWood.zip" download>Télécharger RedWood.zip</a>
<a class="back" href="./">← Retour sur MapForge</a>
<div class="note">Conservez cette page si vous souhaitez revenir sur votre téléchargement.</div>
</main>
</body>
</html>
